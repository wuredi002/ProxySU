name: Windows .NET Framework build and smoke tests

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore ProxySU.sln -NonInteractive

      - name: Build Release solution
        shell: pwsh
        run: msbuild ProxySU.sln /m /t:Rebuild /p:Configuration=Release /p:RestorePackagesConfig=true /verbosity:minimal

      - name: Run configuration and share-link smoke tests
        shell: powershell
        run: .\tests\smoke-tests.ps1

      - name: Package ProxySU.zip
        if: success()
        shell: pwsh
        run: |
          $publishDir = "ProxySuper.WPF/bin/Release"
          if (!(Test-Path "$publishDir/ProxySU.exe") -and !(Get-ChildItem $publishDir -Filter "*.exe" -File -ErrorAction SilentlyContinue)) {
            throw "No executable found in $publishDir"
          }
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path "dist/ProxySU" -Force | Out-Null
          Copy-Item "$publishDir/*" "dist/ProxySU/" -Recurse -Force
          Compress-Archive -Path "dist/ProxySU/*" -DestinationPath "dist/ProxySU.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/ProxySU.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ProxySU.zip" | Set-Content "dist/ProxySU.sha256" -Encoding ascii
          Write-Host "Package size: $((Get-Item 'dist/ProxySU.zip').Length) bytes"
          Write-Host "SHA256: $hash"

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proxysu-windows-release
          path: |
            dist/ProxySU.zip
            dist/ProxySU.sha256
          if-no-files-found: error

      - name: Publish v4.3.3 GitHub Release assets
        if: success() && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.3.3
          name: ProxySU v4.3.3
          files: |
            dist/ProxySU.zip
            dist/ProxySU.sha256
          fail_on_unmatched_files: true
